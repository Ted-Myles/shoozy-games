<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Neon Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #052e16;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden;
    font-family: system-ui, sans-serif;
  }
  canvas { display: block; border-radius: 14px; box-shadow: 0 0 60px rgba(34, 197, 94, 0.4); }
  .hud {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 24px; color: #86efac;
    font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
    background: rgba(5, 46, 22, 0.75); padding: 10px 22px; border-radius: 100px;
    border: 1px solid rgba(134, 239, 172, 0.25); backdrop-filter: blur(10px);
  }
  .hud span { color: #fff; }
</style>
</head>
<body>
  <div class="hud">
    <div>Score <span id="score">0</span></div>
    <div>Best <span id="best">0</span></div>
  </div>
  <canvas id="c" width="600" height="600"></canvas>
  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    const CELL = 24;
    const COLS = c.width / CELL;
    const ROWS = c.height / CELL;

    let snake, dir, nextDir, food, score, best, speed, lastMove, dead;
    best = parseInt(localStorage.getItem('snake_best') || '0', 10);
    document.getElementById('best').textContent = best;

    function reset() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 }; nextDir = { x: 1, y: 0 };
      score = 0; speed = 130; lastMove = 0; dead = false;
      placeFood();
      document.getElementById('score').textContent = score;
    }

    function placeFood() {
      while (true) {
        const f = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
        if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
      }
    }

    document.addEventListener('keydown', (e) => {
      const k = e.key;
      if (k === 'ArrowUp' || k === 'w') if (dir.y === 0) nextDir = { x: 0, y: -1 };
      if (k === 'ArrowDown' || k === 's') if (dir.y === 0) nextDir = { x: 0, y: 1 };
      if (k === 'ArrowLeft' || k === 'a') if (dir.x === 0) nextDir = { x: -1, y: 0 };
      if (k === 'ArrowRight' || k === 'd') if (dir.x === 0) nextDir = { x: 1, y: 0 };
      if (k === ' ' && dead) reset();
    });

    function update(t) {
      if (dead) return;
      if (t - lastMove < speed) return;
      lastMove = t; dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
          snake.some(s => s.x === head.x && s.y === head.y)) {
        dead = true;
        if (score > best) {
          best = score;
          localStorage.setItem('snake_best', best);
          document.getElementById('best').textContent = best;
        }
        return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').textContent = score;
        speed = Math.max(60, speed - 4);
        placeFood();
      } else snake.pop();
    }

    function draw() {
      ctx.fillStyle = '#052e16';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.strokeStyle = 'rgba(134, 239, 172, 0.06)';
      for (let i = 0; i <= COLS; i++) {
        ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, c.height); ctx.stroke();
      }
      for (let i = 0; i <= ROWS; i++) {
        ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(c.width, i * CELL); ctx.stroke();
      }
      ctx.shadowColor = '#fb923c'; ctx.shadowBlur = 20;
      ctx.fillStyle = '#fb923c';
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      snake.forEach((s, i) => {
        const t = i / snake.length;
        const hue = 140 + t * 30;
        ctx.fillStyle = `hsl(${hue}, 80%, ${65 - t * 15}%)`;
        ctx.shadowColor = `hsl(${hue}, 80%, 60%)`;
        ctx.shadowBlur = i === 0 ? 24 : 12;
        const r = i === 0 ? 8 : 5;
        ctx.beginPath();
        ctx.roundRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4, r);
        ctx.fill();
      });
      ctx.shadowBlur = 0;
      if (dead) {
        ctx.fillStyle = 'rgba(5, 46, 22, 0.88)';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 44px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', c.width / 2, c.height / 2 - 15);
        ctx.font = '600 16px system-ui';
        ctx.fillStyle = '#86efac';
        ctx.fillText('Press SPACE to play again', c.width / 2, c.height / 2 + 35);
      }
    }

    function loop(t) { update(t); draw(); requestAnimationFrame(loop); }
    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
